<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <style>
      .c-outline{stop-color:#1B2A5C}.c-light{stop-color:#BFEFFF}.c-mid{stop-color:#5CC8FF}.c-dark{stop-color:#2A7FD6}.c-hi{stop-color:#FFFFFF}
      .c-gold-l{stop-color:#FFF2A8}.c-gold-m{stop-color:#FFC83D}.c-gold-d{stop-color:#E08A00}
      .c-green-l{stop-color:#C9F7A5}.c-green-m{stop-color:#5FD35F}.c-green-d{stop-color:#2E9E44}
      .c-red-l{stop-color:#FFB3A8}.c-red-m{stop-color:#FF6B5C}.c-red-d{stop-color:#C93B3B}
      .c-wood-l{stop-color:#E8B98A}.c-wood-m{stop-color:#B97A4A}.c-wood-d{stop-color:#7A4A2A}
      .c-steel-l{stop-color:#E3EAF2}.c-steel-m{stop-color:#A9B8CC}.c-steel-d{stop-color:#6B7C96}
    </style>
    <linearGradient id="play-s-outline" gradientUnits="userSpaceOnUse"><stop class="c-outline"/></linearGradient>
    <linearGradient id="play-g1" gradientUnits="userSpaceOnUse" x1="140" y1="100" x2="330" y2="410"><stop class="c-green-l"/><stop offset="0.5" class="c-green-m"/><stop offset="1" class="c-green-d"/></linearGradient>
    <linearGradient id="play-s-green-d" gradientUnits="userSpaceOnUse"><stop class="c-green-d"/></linearGradient>
    <linearGradient id="play-s-hi" gradientUnits="userSpaceOnUse"><stop class="c-hi"/></linearGradient>
  </defs>
  <!-- outline under the rounded triangle -->
  <path fill="url(#play-s-outline)" d="M158 112L400 256L158 400Z"/>
  <path stroke="url(#play-s-outline)" stroke-width="108" stroke-linejoin="round" stroke-linecap="round" d="M158 112L400 256L158 400Z"/>
  <!-- triangle -->
  <path fill="url(#play-g1)" d="M158 112L400 256L158 400Z"/>
  <path stroke="url(#play-g1)" stroke-width="72" stroke-linejoin="round" stroke-linecap="round" d="M158 112L400 256L158 400Z"/>
  <path fill="url(#play-s-green-d)" opacity=".55" d="M158 400L400 256L400 256L300 256L158 340Z"/>
  <path stroke="url(#play-s-hi)" stroke-width="18" stroke-linejoin="round" stroke-linecap="round" opacity=".9" d="M142 128V214"/>
</svg>
