    <linearGradient id="tips-s-hi" gradientUnits="userSpaceOnUse"><stop class="c-hi"/></linearGradient>
    <linearGradient id="tips-s-gold-d" gradientUnits="userSpaceOnUse"><stop class="c-gold-d"/></linearGradient>
    <linearGradient id="tips-g2" gradientUnits="userSpaceOnUse" x1="196" y1="384" x2="316" y2="456"><stop class="c-steel-l"/><stop offset="0.5" class="c-steel-m"/><stop offset="1" class="c-steel-d"/></linearGradient>
    <linearGradient id="tips-s-steel-d" gradientUnits="userSpaceOnUse"><stop class="c-steel-d"/></linearGradient>
