<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <style>
      .c-outline{stop-color:#1B2A5C}.c-light{stop-color:#BFEFFF}.c-mid{stop-color:#5CC8FF}.c-dark{stop-color:#2A7FD6}.c-hi{stop-color:#FFFFFF}
      .c-gold-l{stop-color:#FFF2A8}.c-gold-m{stop-color:#FFC83D}.c-gold-d{stop-color:#E08A00}
      .c-green-l{stop-color:#C9F7A5}.c-green-m{stop-color:#5FD35F}.c-green-d{stop-color:#2E9E44}
      .c-red-l{stop-color:#FFB3A8}.c-red-m{stop-color:#FF6B5C}.c-red-d{stop-color:#C93B3B}
      .c-wood-l{stop-color:#E8B98A}.c-wood-m{stop-color:#B97A4A}.c-wood-d{stop-color:#7A4A2A}
      .c-steel-l{stop-color:#E3EAF2}.c-steel-m{stop-color:#A9B8CC}.c-steel-d{stop-color:#6B7C96}
    </style>
    <linearGradient id="tool_snowblower-s-steel-l" gradientUnits="userSpaceOnUse"><stop class="c-steel-l"/></linearGradient>
    <linearGradient id="tool_snowblower-s-outline" gradientUnits="userSpaceOnUse"><stop class="c-outline"/></linearGradient>
    <linearGradient id="tool_snowblower-s-steel-d" gradientUnits="userSpaceOnUse"><stop class="c-steel-d"/></linearGradient>
    <linearGradient id="tool_snowblower-g1" gradientUnits="userSpaceOnUse" x1="120" y1="100" x2="400" y2="400"><stop class="c-red-l"/><stop offset="0.5" class="c-red-m"/><stop offset="1" class="c-red-d"/></linearGradient>
    <linearGradient id="tool_snowblower-s-hi" gradientUnits="userSpaceOnUse"><stop class="c-hi"/></linearGradient>
    <linearGradient id="tool_snowblower-g2" gradientUnits="userSpaceOnUse" x1="60" y1="240" x2="240" y2="440"><stop class="c-red-m"/><stop offset="1" class="c-red-d"/></linearGradient>
    <linearGradient id="tool_snowblower-g3" gradientUnits="userSpaceOnUse" x1="90" y1="270" x2="210" y2="400"><stop class="c-hi"/><stop offset="0.5" class="c-steel-l"/><stop offset="1" class="c-steel-m"/></linearGradient>
  </defs>
