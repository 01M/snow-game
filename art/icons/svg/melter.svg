  <path stroke="url(#melter-s-outline)" stroke-width="18" stroke-linejoin="round" stroke-linecap="round" d="M408 190C408 215.4 339.9 236 256 236C172.1 236 104 215.4 104 190C104 164.6 172.1 144 256 144C339.9 144 408 164.6 408 190Z"/>
  <path fill="url(#melter-g4)" d="M150 186C150 120 200 104 236 120C256 80 330 84 340 132C380 136 384 186 362 186Z"/>
