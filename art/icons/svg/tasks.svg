    <linearGradient id="tasks-g1" gradientUnits="userSpaceOnUse" x1="120" y1="76" x2="164" y2="452"><stop class="c-hi"/><stop offset="0.5" class="c-steel-l"/><stop offset="1" class="c-steel-m"/></linearGradient>
    <linearGradient id="tasks-s-outline" gradientUnits="userSpaceOnUse"><stop class="c-outline"/></linearGradient>
    <linearGradient id="tasks-g2" gradientUnits="userSpaceOnUse" x1="172" y1="96" x2="400" y2="272"><stop class="c-green-l"/><stop offset="0.5" class="c-green-m"/><stop offset="1" class="c-green-d"/></linearGradient>
    <linearGradient id="tasks-s-hi" gradientUnits="userSpaceOnUse"><stop class="c-hi"/></linearGradient>
    <linearGradient id="tasks-s-steel-d" gradientUnits="userSpaceOnUse"><stop class="c-steel-d"/></linearGradient>
