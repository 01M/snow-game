<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <style>
      .c-outline{stop-color:#1B2A5C}.c-light{stop-color:#BFEFFF}.c-mid{stop-color:#5CC8FF}.c-dark{stop-color:#2A7FD6}.c-hi{stop-color:#FFFFFF}
      .c-gold-l{stop-color:#FFF2A8}.c-gold-m{stop-color:#FFC83D}.c-gold-d{stop-color:#E08A00}
      .c-green-l{stop-color:#C9F7A5}.c-green-m{stop-color:#5FD35F}.c-green-d{stop-color:#2E9E44}
      .c-red-l{stop-color:#FFB3A8}.c-red-m{stop-color:#FF6B5C}.c-red-d{stop-color:#C93B3B}
      .c-wood-l{stop-color:#E8B98A}.c-wood-m{stop-color:#B97A4A}.c-wood-d{stop-color:#7A4A2A}
      .c-steel-l{stop-color:#E3EAF2}.c-steel-m{stop-color:#A9B8CC}.c-steel-d{stop-color:#6B7C96}
    </style>
    <linearGradient id="invite-g1" gradientUnits="userSpaceOnUse" x1="90" y1="120" x2="270" y2="400"><stop class="c-mid"/><stop offset="1" class="c-dark"/></linearGradient>
    <linearGradient id="invite-s-outline" gradientUnits="userSpaceOnUse"><stop class="c-outline"/></linearGradient>
    <linearGradient id="invite-g2" gradientUnits="userSpaceOnUse" x1="190" y1="130" x2="410" y2="450"><stop class="c-light"/><stop offset="0.5" class="c-mid"/><stop offset="1" class="c-dark"/></linearGradient>
    <linearGradient id="invite-s-hi" gradientUnits="userSpaceOnUse"><stop class="c-hi"/></linearGradient>
    <linearGradient id="invite-g3" gradientUnits="userSpaceOnUse" x1="370" y1="58" x2="462" y2="150"><stop class="c-green-l"/><stop offset="0.5" class="c-green-m"/><stop offset="1" class="c-green-d"/></linearGradient>
