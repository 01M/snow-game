  <path fill="url(#shop-s-outline)" d="M364 436a12 12 0 1 0 24 0a12 12 0 1 0 -24 0Z"/>
  <!-- coin -->
  <path fill="url(#shop-g2)" d="M338 122a66 66 0 1 0 132 0a66 66 0 1 0 -132 0Z"/>
  <path stroke="url(#shop-s-outline)" stroke-width="18" stroke-linejoin="round" stroke-linecap="round" d="M338 122a66 66 0 1 0 132 0a66 66 0 1 0 -132 0Z"/>
  <path stroke="url(#shop-s-gold-d)" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" d="M366 122a38 38 0 1 0 76 0a38 38 0 1 0 -76 0Z"/>
  <path stroke="url(#shop-s-hi)" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" opacity=".9" d="M356 100A52 52 0 0 1 384 72"/>
