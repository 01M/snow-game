  <path stroke="url(#shop-s-steel-l)" stroke-width="24" stroke-linejoin="round" stroke-linecap="round" d="M164 318L182 376H400"/>
  <!-- basket -->
  <path fill="url(#shop-g1)" d="M122 170H430L394 318H160Z"/>
  <path stroke="url(#shop-s-outline)" stroke-width="18" stroke-linejoin="round" stroke-linecap="round" d="M122 170H430L394 318H160Z"/>
  <path stroke="url(#shop-s-dark)" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" d="M232 196L240 292M322 196L314 292"/>
  <path stroke="url(#shop-s-hi)" stroke-width="12" stroke-linejoin="round" stroke-linecap="round" opacity=".9" d="M152 194H212"/>
